name: Verify Veyra

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check build and Python tests
        run: |
          python3 -m py_compile tools/*.py
          python3 tools/build.py --check
          python3 -m unittest discover -s tests/unit -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: 0.744
          path: .luau-cli
      - name: Build Luau CLI
        run: |
          cmake -S .luau-cli -B .luau-cli-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build .luau-cli-build --target Luau.Repl.CLI Luau.Compile.CLI -j 2
      - name: Compile Luau sources
        run: |
          for file in main.lua src/*.lua tests/runtime/*.lua tools/quest_diagnostic.lua tools/quest_tracking_diagnostic.lua tools/character_diagnostic.lua; do
            echo "Compiling $file"
            ./.luau-cli-build/luau-compile "$file" > /dev/null
          done
