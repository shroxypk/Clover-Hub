name: Verify Clover Hub

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python scripts and bundled release
        run: |
          python3 -m py_compile build.py publish.py export_seed.py
          python3 build.py --check
          python3 -m unittest discover -v -p "test_*.py"
      - uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: 0.744
          path: .luau-cli
      - name: Build Luau command-line tools
        run: |
          cmake -S .luau-cli -B .luau-cli-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build .luau-cli-build --target Luau.Repl.CLI Luau.Compile.CLI -j 2
      - name: Compile all Luau source and verification scripts
        run: |
          for file in *.lua *.luau; do
            echo "Compiling $file"
            ./.luau-cli-build/luau-compile "$file" > /dev/null
          done
      - name: Run pure Luau tests
        run: |
          for file in test_*.luau; do
            echo "Running $file"
            ./.luau-cli-build/luau "$file"
          done
